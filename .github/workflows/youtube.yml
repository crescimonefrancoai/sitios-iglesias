name: Enseñanzas desde YouTube

on:
  schedule:
    - cron: "40 */6 * * *" # cada 6 horas
  workflow_dispatch:
    inputs:
      cliente:
        description: "Cliente (vacío = todos los que tienen canal de YouTube)"
        required: false
        type: string

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      cambio: ${{ steps.youtube.outputs.cambio }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix agente --no-audit --no-fund
      - id: youtube
        name: Buscar videos nuevos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLIENTE: ${{ inputs.cliente }}
        run: node agente/youtube.mjs
      - name: Guardar las enseñanzas
        if: steps.youtube.outputs.cambio == 'si'
        run: bash agente/guardar.sh "$RUNNER_TEMP/mensaje-commit.txt"
      - name: Marcar si algún canal falló
        if: steps.youtube.outputs.fallas != '0'
        run: |
          echo "Algún canal no se pudo revisar: ver el resumen de esta ejecución."
          exit 1

  publicar:
    needs: importar
    if: always() && needs.importar.outputs.cambio == 'si'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
