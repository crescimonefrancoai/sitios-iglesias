name: Agente - pedir un cambio

on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "Cliente (nombre del archivo en clientes/, sin .json)"
        required: true
        type: string
        default: puerto-seguro
      pedido:
        description: "Qué hay que cambiar, en palabras comunes"
        required: true
        type: string
      aviso:
        description: "Uso interno del agente de WhatsApp (dejar vacío)"
        required: false
        type: string
        default: ""
      contexto:
        description: "Uso interno: mensajes recientes de la conversación por WhatsApp (dejar vacío)"
        required: false
        type: string
        default: ""

# Sin fila única: GitHub cancela los pedidos que quedan en espera si llega otro. Cada pedido corre por
# su cuenta y, si dos guardan a la vez, agente/guardar.sh combina los cambios y reintenta.

jobs:
  cambiar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      cambio: ${{ steps.agente.outputs.cambio }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix agente --no-audit --no-fund
      - id: agente
        name: Ejecutar el agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLIENTE: ${{ inputs.cliente }}
          PEDIDO: ${{ inputs.pedido }}
          CONTEXTO: ${{ inputs.contexto }}
        run: node agente/agente.mjs
      - name: Guardar el cambio
        if: steps.agente.outputs.cambio == 'si'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLIENTE: ${{ inputs.cliente }}
          PEDIDO: ${{ inputs.pedido }}
          CONTEXTO: ${{ inputs.contexto }}
        run: |
          bash agente/guardar.sh "$RUNNER_TEMP/mensaje-commit.txt" && exit 0
          # Chocó con otro cambio guardado al mismo tiempo (por ejemplo, dos pedidos seguidos que agregan eventos):
          # se repite el pedido una vez sobre los datos ya actualizados.
          echo "Se repite el pedido sobre los datos actualizados."
          git fetch -q origin main && git reset -q --hard origin/main
          node agente/agente.mjs || exit 1
          bash agente/guardar.sh "$RUNNER_TEMP/mensaje-commit.txt" && exit 0
          echo "⚠️ No pude hacer el cambio porque justo se guardó otro al mismo tiempo. Envíame el pedido de nuevo, por favor." > "$RUNNER_TEMP/respuesta-whatsapp.txt"
          exit 1
      # Si el pedido llegó por WhatsApp, se le cuenta el resultado a quien lo hizo (pase lo que pase)
      - name: Avisar por WhatsApp
        if: always() && inputs.aviso != ''
        # Si el aviso falla, el cambio ya está guardado: igual tiene que publicarse
        continue-on-error: true
        env:
          URL: ${{ secrets.WHATSAPP_AVISO_URL }}
          SECRETO: ${{ secrets.WHATSAPP_AVISO_SECRET }}
          AVISO: ${{ inputs.aviso }}
          ESTADO: ${{ job.status }}
        run: |
          archivo="$RUNNER_TEMP/respuesta-whatsapp.txt"
          if [ "$ESTADO" != "success" ] && ! grep -q "No pude hacer el cambio" "$archivo" 2>/dev/null; then
            echo "⚠️ No pude hacer el cambio. Hubo un problema técnico y ya quedó registrado; vuelve a intentarlo en unos minutos." > "$archivo"
          fi
          jq -n --arg id "$AVISO" --rawfile texto "$archivo" '{id: $id, texto: $texto}' \
            | curl -sS --fail-with-body -X POST "$URL" \
                -H "Authorization: Bearer $SECRETO" -H "Content-Type: application/json" --data @-

  publicar:
    needs: cambiar
    if: needs.cambiar.outputs.cambio == 'si'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
