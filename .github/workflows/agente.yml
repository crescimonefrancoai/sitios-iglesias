name: Agente - pedir un cambio

on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "Cliente (nombre del archivo en clientes/, sin .json)"
        required: true
        type: string
        default: puerto-seguro
      pedido:
        description: "Qué hay que cambiar, en palabras comunes"
        required: true
        type: string
      aviso:
        description: "Uso interno del agente de WhatsApp (dejar vacío)"
        required: false
        type: string
        default: ""

# Un pedido a la vez, para que dos cambios no se pisen
concurrency:
  group: cambios
  cancel-in-progress: false

jobs:
  cambiar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      cambio: ${{ steps.agente.outputs.cambio }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix agente --no-audit --no-fund
      - id: agente
        name: Ejecutar el agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLIENTE: ${{ inputs.cliente }}
          PEDIDO: ${{ inputs.pedido }}
        run: node agente/agente.mjs
      - name: Guardar el cambio
        if: steps.agente.outputs.cambio == 'si'
        run: |
          git config user.name "agente-sitios"
          git config user.email "agente-sitios@users.noreply.github.com"
          git add clientes
          git commit -F "$RUNNER_TEMP/mensaje-commit.txt"
          git push
      # Si el pedido llegó por WhatsApp, se le cuenta el resultado a quien lo hizo (pase lo que pase)
      - name: Avisar por WhatsApp
        if: always() && inputs.aviso != ''
        env:
          URL: ${{ secrets.WHATSAPP_AVISO_URL }}
          SECRETO: ${{ secrets.WHATSAPP_AVISO_SECRET }}
          AVISO: ${{ inputs.aviso }}
          ESTADO: ${{ job.status }}
        run: |
          archivo="$RUNNER_TEMP/respuesta-whatsapp.txt"
          if [ "$ESTADO" != "success" ] && ! grep -q "No pude hacer el cambio" "$archivo" 2>/dev/null; then
            echo "⚠️ No pude hacer el cambio. Hubo un problema técnico y ya quedó registrado; vuelve a intentarlo en unos minutos." > "$archivo"
          fi
          jq -n --arg id "$AVISO" --rawfile texto "$archivo" '{id: $id, texto: $texto}' \
            | curl -sS --fail-with-body -X POST "$URL" \
                -H "Authorization: Bearer $SECRETO" -H "Content-Type: application/json" --data @-

  publicar:
    needs: cambiar
    if: needs.cambiar.outputs.cambio == 'si'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
